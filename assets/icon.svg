<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="gentle-canvas-tailscale">
  <title>gentle-canvas-tailscale</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1530"/>
      <stop offset="1" stop-color="#0d0b17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- the canvas: an artboard frame with two design blocks -->
  <rect x="22" y="26" width="60" height="46" rx="7" fill="none" stroke="url(#accent)" stroke-width="5"/>
  <rect x="31" y="35" width="24" height="6" rx="3" fill="#a78bfa"/>
  <rect x="31" y="47" width="42" height="16" rx="4" fill="#a78bfa" opacity=".35"/>
  <!-- the tailnet: three linked devices -->
  <path d="M82 72 L98 92 M98 92 L70 102 M82 72 L70 102" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <circle cx="82" cy="72" r="8" fill="#22d3ee"/>
  <circle cx="98" cy="92" r="8" fill="#22d3ee"/>
  <circle cx="70" cy="102" r="8" fill="#22d3ee"/>
</svg>
